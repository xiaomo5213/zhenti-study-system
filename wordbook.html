<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的生词本 · 撷墨真题学习系统</title>
    <link rel="icon" type="image/svg+xml" href="_sys/favicon.svg">
    <style>
        :root {
            --brand: #0f766e;
            --blue: #2563eb;
            --red: #e03131;
            --line: #e6ecf4;
            --txt: #22364d;
            --sub: #7b8fa6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: #f2f5f9;
            color: var(--txt);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 22px 16px 60px;
        }

        /* ---------- 头部 ---------- */
        .hero {
            background: linear-gradient(135deg, #0f766e, #0ea5e9);
            border-radius: 18px;
            padding: 22px 24px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            box-shadow: 0 10px 30px rgba(14, 116, 144, .25);
        }

        .hero .mark {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex: none;
        }

        .hero h1 { font-size: 1.25rem; font-weight: 700; }

        .hero .sub {
            font-size: .8rem;
            opacity: .85;
            margin-top: 3px;
        }

        .hero .cnt {
            margin-left: auto;
            background: rgba(255, 255, 255, .16);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: .86rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ---------- 工具栏 ---------- */
        .tools {
            display: flex;
            gap: 8px;
            margin: 14px 0 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tools input {
            flex: 1;
            min-width: 180px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: .88rem;
            font-family: inherit;
            color: var(--txt);
            outline: none;
        }

        .tools input:focus { border-color: #8fbce8; box-shadow: 0 0 0 3px rgba(37, 99, 235, .10); }

        .tbtn {
            border: 1px solid var(--line);
            background: #fff;
            color: #40566e;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all .15s;
            white-space: nowrap;
        }

        .tbtn:hover { border-color: #cbd5e1; background: #f8fafc; }

        .tbtn.danger { color: #c0392b; }

        .tbtn.danger:hover { background: #fdecec; border-color: #f0b7b7; }

        .tbtn.play-all { color: #fff; background: #d97706; border-color: #d97706; }

        .tbtn.play-all:hover { background: #b45309; }

        .tbtn.play-all.stop { background: #40566e; border-color: #40566e; }

        /* ---------- 词表（仿 WordForest 词书） ---------- */
        .wb-list {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(20, 45, 80, .05);
        }

        .wb-row {
            display: flex;
            border-bottom: 1px solid #eef2f7;
            transition: background .12s;
            position: relative;
        }

        .wb-row:last-child { border-bottom: none; }

        .wb-row:hover { background: #f8fbfd; }

        .wb-no {
            flex: none;
            width: 46px;
            min-height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 16px 0;
            font-size: .82rem;
            font-weight: 700;
            color: #1a9e6b;
            background: #e4f5ec;
        }

        .wb-row:nth-child(even) .wb-no { background: #fff; color: #9db4a8; }

        .wb-main { flex: 1; min-width: 0; padding: 12px 14px 12px 4px; }

        .wb-word-line {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .wb-word {
            font-size: 1.06rem;
            font-weight: 700;
            color: var(--blue);
            cursor: pointer;
        }

        .wb-word:hover { text-decoration: underline; }

        .wb-ph {
            font-size: .76rem;
            color: var(--sub);
            font-family: "Segoe UI", "Lucida Sans Unicode", Arial, sans-serif;
        }

        .wb-sp {
            border: none;
            background: none;
            color: #9fb2c6;
            font-size: .74rem;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 6px;
            line-height: 1;
            transition: all .14s;
            font-family: inherit;
        }

        .wb-sp:hover { color: var(--blue); background: #eef3fb; }

        .wb-sp.playing { color: #fff; background: var(--brand); }

        .wb-defs { margin-top: 5px; }

        .wb-def {
            font-size: .86rem;
            line-height: 1.7;
            display: flex;
            gap: 7px;
            align-items: baseline;
        }

        .wb-pos {
            flex: none;
            color: var(--red);
            font-style: italic;
            font-weight: 600;
            font-size: .8rem;
            min-width: 34px;
        }

        .wb-zh { color: #33465c; }

        .wb-ctx {
            margin-top: 6px;
            font-size: .78rem;
            color: #8b9aab;
            line-height: 1.6;
            padding-left: 9px;
            border-left: 2px solid #dbe6f2;
        }

        .wb-ctx b { color: #1f4e8c; font-weight: 600; }

        .wb-del {
            position: absolute;
            right: 10px;
            top: 10px;
            border: none;
            background: none;
            color: #c3cfdc;
            font-size: .9rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            line-height: 1;
            opacity: 0;
            transition: all .15s;
            font-family: inherit;
        }

        .wb-row:hover .wb-del { opacity: 1; }

        .wb-del:hover { color: #fff; background: #f04438; }

        /* ---------- 空状态 ---------- */
        .empty {
            text-align: center;
            padding: 70px 20px;
            color: var(--sub);
        }

        .empty .big { font-size: 44px; margin-bottom: 12px; }

        .empty p { font-size: .9rem; line-height: 1.8; }

        .empty a {
            display: inline-block;
            margin-top: 14px;
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 22px;
            font-size: .88rem;
            font-weight: 600;
        }

        .empty a:hover { background: #0d5f59; }

        .foot-tip {
            margin-top: 12px;
            font-size: .74rem;
            color: #a2b0c0;
            text-align: center;
        }

        /* ---------- 移动端 ---------- */
        @media (max-width: 640px) {
            .wrap { padding: 14px 10px 50px; }
            .hero { padding: 16px; border-radius: 14px; }
            .hero .cnt { margin-left: 0; }
            .wb-no { width: 38px; padding: 13px 0; }
            .wb-word { font-size: 1rem; }
            .wb-del { opacity: 1; right: 6px; }
            .tbtn { padding: 9px 11px; font-size: .8rem; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <div class="mark">📖</div>
            <div>
                <h1>我的生词本</h1>
                <div class="sub">点词查词时收藏的生词都在这里 · 点击单词或喇叭可发音</div>
            </div>
            <div class="cnt" id="cnt">0 个单词</div>
        </div>

        <div class="tools">
            <input id="kw" type="search" placeholder="搜索单词或释义…" autocomplete="off">
            <button class="tbtn play-all" id="playAll">🔊 连播</button>
            <button class="tbtn" id="exportBtn">⬇ 导出 CSV</button>
            <button class="tbtn danger" id="clearBtn">🗑 清空</button>
        </div>

        <div class="wb-list" id="list"></div>
        <div class="foot-tip">数据保存在本机浏览器（localStorage 键 xt.wordbook.v1）· 长按/悬停单词行可删除</div>
    </div>

    <script>
        (function () {
            'use strict';
            var WB = 'xt.wordbook.v1';
            var VOICE = 'https://dict.youdao.com/dictvoice';
            var list = document.getElementById('list');
            var kw = document.getElementById('kw');
            var audio = null, playIdx = -1, playing = false;

            function getData() {
                try { return JSON.parse(localStorage.getItem(WB) || '[]'); }
                catch (e) { return []; }
            }
            function saveData(d) {
                try { localStorage.setItem(WB, JSON.stringify(d)); } catch (e) { }
            }
            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }
            function stopAudio() {
                if (audio) { try { audio.pause(); } catch (e) { } audio = null; }
                playing = false;
                document.querySelectorAll('.wb-sp.playing').forEach(function (b) { b.classList.remove('playing'); });
                var pa = document.getElementById('playAll');
                pa.textContent = '🔊 连播'; pa.classList.remove('stop');
            }
            function play(text, type, btn) {
                stopAudio();
                audio = new Audio(VOICE + '?audio=' + encodeURIComponent(text) +
                    '&type=' + (type === 'uk' ? 1 : 2));
                if (btn) {
                    btn.classList.add('playing');
                    var off = function () { btn.classList.remove('playing'); };
                    audio.addEventListener('ended', off);
                    audio.addEventListener('error', off);
                    setTimeout(off, 15000);
                }
                audio.play().catch(function () { stopAudio(); });
            }

            function hlWord(sent, w) {
                var re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                return esc(sent).replace(re, '<b>$1</b>');
            }

            function render() {
                var data = getData();
                var k = (kw.value || '').trim().toLowerCase();
                var rows = data.filter(function (x) {
                    if (!k) return true;
                    var hay = (x.w + ' ' + (x.ph || '') + ' ' +
                        (x.defs || []).map(function (d) { return (d.pos || '') + (d.zh || ''); }).join(' ') +
                        ' ' + (x.ctx || '') + ' ' + (x.ctxZh || '')).toLowerCase();
                    return hay.indexOf(k) > -1;
                });

                document.getElementById('cnt').textContent = data.length + ' 个单词';

                if (!rows.length) {
                    list.innerHTML = '<div class="empty"><div class="big">🌱</div>' +
                        (data.length
                            ? '<p>没有匹配「' + esc(k) + '」的生词</p>'
                            : '<p>生词本还是空的。<br>在各题型材料里<b>点击任意单词</b>，弹窗中点「⭐ 加入生词本」即可收藏。</p>' +
                              '<a href="index.html">← 去学习中心刷题</a>') +
                        '</div>';
                    return;
                }

                var h = '';
                rows.forEach(function (x, i) {
                    h += '<div class="wb-row" data-w="' + esc(x.w) + '">';
                    h += '<div class="wb-no">' + (i + 1) + '</div>';
                    h += '<div class="wb-main">';
                    h += '<div class="wb-word-line">' +
                        '<span class="wb-word" data-act="play-uk" title="点击发音">' + esc(x.w) + '</span>' +
                        (x.ph ? '<span class="wb-ph">' + esc(x.ph) + '</span>' : '') +
                        '<button class="wb-sp" data-act="play-uk" title="英音">🔊 英</button>' +
                        '<button class="wb-sp" data-act="play-us" title="美音">🔊 美</button>' +
                        '</div>';
                    if (x.defs && x.defs.length) {
                        h += '<div class="wb-defs">';
                        x.defs.forEach(function (d) {
                            if (!d.zh && !d.en) return;
                            h += '<div class="wb-def">' +
                                (d.pos ? '<span class="wb-pos">' + esc(d.pos) + '</span>' : '<span class="wb-pos"></span>') +
                                '<span class="wb-zh">' + esc(d.zh || d.en) + '</span></div>';
                        });
                        h += '</div>';
                    }
                    if (x.ctx) {
                        h += '<div class="wb-ctx">📌 ' + hlWord(x.ctx, x.w) +
                            (x.ctxZh ? '<br>译：' + esc(x.ctxZh) : '') + '</div>';
                    }
                    h += '</div>';
                    h += '<button class="wb-del" data-act="del" title="删除">✕</button>';
                    h += '</div>';
                });
                list.innerHTML = h;
            }

            /* ---------- 事件 ---------- */
            list.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-act]');
                if (!btn) return;
                var row = e.target.closest('.wb-row');
                var w = row ? row.getAttribute('data-w') : '';
                if (!w) return;
                var act = btn.getAttribute('data-act');
                if (act === 'del') {
                    saveData(getData().filter(function (x) { return x.w !== w; }));
                    render();
                    return;
                }
                if (act === 'play-uk') { play(w, 'uk', btn); return; }
                if (act === 'play-us') { play(w, 'us', btn); return; }
            });

            kw.addEventListener('input', render);

            document.getElementById('exportBtn').addEventListener('click', function () {
                var d = getData();
                if (!d.length) { alert('生词本为空'); return; }
                var csv = '\uFEFF单词,音标,释义,原文例句,例句翻译,收藏时间\n';
                d.forEach(function (x) {
                    var defs = (x.defs || []).map(function (dd) {
                        return (dd.pos ? dd.pos + ' ' : '') + (dd.zh || dd.en || '');
                    }).join('；');
                    var q = function (s) { return '"' + String(s || '').replace(/"/g, '""') + '"'; };
                    csv += [q(x.w), q(x.ph), q(defs), q(x.ctx), q(x.ctxZh),
                        q(x.ts ? new Date(x.ts).toLocaleString('zh-CN') : '')].join(',') + '\n';
                });
                var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = '撷墨生词本_' + new Date().toISOString().slice(0, 10) + '.csv';
                a.click();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
            });

            document.getElementById('clearBtn').addEventListener('click', function () {
                if (!getData().length) { alert('生词本为空'); return; }
                if (confirm('确定清空全部生词吗？此操作不可恢复。')) {
                    saveData([]);
                    render();
                }
            });

            document.getElementById('playAll').addEventListener('click', function () {
                if (playing) { stopAudio(); return; }
                var d = getData();
                var k = (kw.value || '').trim().toLowerCase();
                var rows = d.filter(function (x) {
                    if (!k) return true;
                    return (x.w || '').toLowerCase().indexOf(k) > -1;
                });
                if (!rows.length) { alert('没有可播放的单词'); return; }
                playing = true;
                this.textContent = '⏹ 停止';
                this.classList.add('stop');
                playIdx = -1;
                var self = this;
                (function next() {
                    if (!playing) return;
                    playIdx++;
                    if (playIdx >= rows.length) { stopAudio(); return; }
                    var x = rows[playIdx];
                    var rowEl = list.querySelector('.wb-row[data-w="' + x.w.replace(/"/g, '\\"') + '"]');
                    var btn = rowEl ? rowEl.querySelector('.wb-sp[data-act="play-uk"]') : null;
                    if (btn) {
                        document.querySelectorAll('.wb-sp.playing').forEach(function (b) { b.classList.remove('playing'); });
                        btn.classList.add('playing');
                        if (rowEl && rowEl.scrollIntoView) rowEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                    try {
                        if (audio) { try { audio.pause(); } catch (e) { } }
                        audio = new Audio(VOICE + '?audio=' + encodeURIComponent(x.w) + '&type=1');
                        audio.addEventListener('ended', function () { setTimeout(next, 500); });
                        audio.addEventListener('error', function () { setTimeout(next, 200); });
                        audio.play().catch(function () { setTimeout(next, 200); });
                    } catch (e) { setTimeout(next, 200); }
                })();
            });

            render();
        })();
    </script>
</body>
</html>

                                <option value="en-US-AriaNeural">👩 美式女声 Aria</option>
                                <option value="en-US-GuyNeural">👨 美式男声 Guy</option>
                                <option value="en-GB-SoniaNeural">👩 英式女声 Sonia</option>
                                <option value="en-GB-RyanNeural">👨 英式男声 Ryan</option>

<script>
    let currentExamIndex = 0;
    let currentPage = 1;
    let userAnswers = {};
    let isTranslated = false;
    let submitted = false;
    let ttsAudio = null;

    const examInfo = document.getElementById('examInfo');
    const articleTitle = document.getElementById('articleTitle');
    const articleContent = document.getElementById('articleContent');
    const quizContent = document.getElementById('quizContent');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInput = document.getElementById('pageInput');
    const translateBtn = document.getElementById('translateBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const submitBtn = document.getElementById('submitBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');

    // ========== 音色选择持久化 ==========
    const VOICE_STORAGE_KEY = 'tts_voice_preference';
    const DEFAULT_VOICE = 'en-US-AvaMultilingualNeural';
    function loadVoicePreference() {
        try {
            const saved = localStorage.getItem(VOICE_STORAGE_KEY);
            if (saved && voiceSelect.querySelector(`option[value="${saved}"]`)) {
                voiceSelect.value = saved;
            }
        } catch (e) { /* 忽略隐私模式报错 */ }
        return voiceSelect.value || DEFAULT_VOICE;
    }
    function saveVoicePreference(v) {
        try { localStorage.setItem(VOICE_STORAGE_KEY, v); } catch (e) {}
    }
    voiceSelect.addEventListener('change', () => {
        saveVoicePreference(voiceSelect.value);
    });
    loadVoicePreference();

    function initPage() {
        currentExamIndex = currentPage - 1;
        if (currentExamIndex < 0) currentExamIndex = 0;
        if (currentExamIndex >= exams.length) currentExamIndex = exams.length - 1;
        currentPage = currentExamIndex + 1;
        pageInput.value = currentPage;

        const exam = exams[currentExamIndex];
        examInfo.textContent = `${exam.year}真题`;
        articleTitle.textContent = exam.articleTitle;

        submitted = false;
        scoreDisplay.textContent = '得分：--';

        isTranslated = false;
        translateBtn.textContent = '🌐 全文翻译';
        translateBtn.classList.remove('active');
        voiceSelect.style.display = 'none';

        renderArticle();
        renderQuiz();
        renderPager();
    }

    function renderArticle() {
        const exam = exams[currentExamIndex];
        let html = '';
        const trans = translations[exam.year] || [];

        // 供「点词查词」使用：当期 英文句子 → 中文翻译（dldy 的译文是「段落→句子数组」结构）
        window.__xtTrans = {};
        exam.paragraphs.forEach(function (xtPara, xtP) {
            const xtTrans = trans[xtP] || [];
            const xtSentences = String(xtPara.text).match(/[^.!?]+[.!?]+/g) || [xtPara.text];
            xtSentences.forEach(function (xtSent, xtI) {
                const xtKey = xtSent.trim();
                if (xtKey && xtTrans[xtI]) window.__xtTrans[xtKey] = xtTrans[xtI];
            });
        });

        exam.paragraphs.forEach((para, pIdx) => {
            const colorClass = para.colorClass;
            const paraTrans = trans[pIdx] || [];

            html += `<div class="para-block ${colorClass}">`;

            if (isTranslated) {
                const sentences = para.text.match(/[^.!?]+[.!?]+/g) || [para.text];
                sentences.forEach((sentence, sIdx) => {
                    const trimmed = sentence.trim();
                    if (!trimmed) return;
                    const transText = paraTrans[sIdx] || '';
                    html += `<div class="sentence-block">`;
                    html += `<div class="sentence-line">`;
                    html += `<span class="eng-sentence-text">${trimmed}</span>`;
                    html += `<span class="speaker" data-sentence="${encodeURIComponent(trimmed)}" onclick="speakSentence(this)"><svg viewBox="0 0 24 24" width="13" height="13" style="display:block" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.6a5 5 0 0 1 0 6.8M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>`;
                    html += `</div>`;
                    if (transText) {
                        html += `<div class="trans-text">${transText}</div>`;
                    }
                    html += `</div>`;
                });
            } else {
                html += `<div class="eng-text"><span>${para.text}</span></div>`;
            }

            html += `</div>`;
        });

        articleContent.innerHTML = html;
    }

    // ========== 英文句子朗读（走 Cloudflare Worker TTS） ==========
    const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    let audioUnlocked = false;

    // 必须在用户点击手势内同步调用，否则异步请求回来后浏览器会拒绝自动播放
    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            ttsAudio = new Audio(SILENT_WAV);
            ttsAudio.volume = 0;
            const p = ttsAudio.play();
            if (p && p.catch) p.catch(() => {});
            audioUnlocked = true;
        } catch (e) { /* 忽略 */ }
    }

    window.speakSentence = async function(el) {
        if (!isTranslated) return;
        const text = decodeURIComponent(el.getAttribute('data-sentence') || '');
        if (!text) return;

        // 在点击手势内同步解锁音频，避免 fetch 返回后 play() 被浏览器拦截
        unlockAudio();

        if (el.dataset.loading === '1') return;
        el.dataset.loading = '1';
        el.classList.add('speaking');

        // 超时控制：TTS 无响应时不再无限等待
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);

        try {
            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio = null;
            }

            const voice = voiceSelect.value || 'en-US-JennyNeural';

            const response = await fetch('https://api.xiemojy.mom/v1/audio/speech', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    input: text,
                    voice: voice
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (!response.ok) throw new Error('TTS 接口返回 ' + response.status);

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            ttsAudio = new Audio(audioUrl);

            ttsAudio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                el.classList.remove('speaking');
                el.dataset.loading = '';
            };
            ttsAudio.onerror = () => {
                URL.revokeObjectURL(audioUrl);
                el.classList.remove('speaking');
                el.dataset.loading = '';
            };

            await ttsAudio.play();
        } catch (err) {
            clearTimeout(timeoutId);
            console.error('TTS 播放失败:', err);
            el.classList.remove('speaking');
            el.dataset.loading = '';
            if (err && err.name === 'AbortError') {
                alert('语音请求超时，请检查网络后重试');
            } else {
                alert('语音播放失败：' + err.message);
            }
        }
    };

    function renderQuiz() {
        const exam = exams[currentExamIndex];
        let html = '';

        exam.tasks.forEach((task) => {
            html += `<div class="task-section">`;
            html += `<div class="task-title">${task.title}</div>`;

            task.questions.forEach(q => {
                const qKey = `${currentExamIndex}_${q.id}`;
                const selected = userAnswers[qKey] || '';
                html += `<div class="question-wrapper" id="wrapper-${q.id}">`;
                html += `<div class="match-item ${q.color || ''}" data-qid="${q.id}">`;
                html += `<span class="q-label">${q.label}</span>`;
                html += `<div class="options">`;
                q.options.forEach(optLetter => {
                    const optText = task.optionTexts[optLetter] || optLetter;
                    const selectedClass = (selected === optLetter) ? 'selected' : '';
                    html += `<div class="opt ${selectedClass}" data-qid="${q.id}" data-opt="${optLetter}" onclick="selectOption(this, '${q.id}', '${optLetter}')">${optLetter}. ${optText}</div>`;
                });
                html += `</div></div>`;
                html += `<div class="explain-inline ${q.color || ''}" id="explain-${q.id}" style="display:none;"></div>`;
                html += `</div>`;
            });

            html += `</div>`;
        });

        quizContent.innerHTML = html;
    }

    window.selectOption = function(el, qid, optLetter) {
        if (submitted) return;
        const qKey = `${currentExamIndex}_${qid}`;
        userAnswers[qKey] = optLetter;

        const parent = el.closest('.match-item');
        if (parent) {
            parent.querySelectorAll('.opt').forEach(opt => opt.classList.remove('selected'));
        }
        el.classList.add('selected');
    };

    function submitAnswers() {
        const exam = exams[currentExamIndex];
        let totalQuestions = 0;
        let correctCount = 0;

        exam.tasks.forEach(task => {
            task.questions.forEach(q => {
                totalQuestions++;
                const qKey = `${currentExamIndex}_${q.id}`;
                const userAns = userAnswers[qKey];
                if (userAns === q.correct) {
                    correctCount++;
                }
            });
        });

        const score = correctCount * 2;
        scoreDisplay.textContent = `得分：${score} / ${totalQuestions * 2}`;

        const examExplain = explanations[exam.year] || {};

        exam.tasks.forEach(task => {
            task.questions.forEach(q => {
                const qKey = `${currentExamIndex}_${q.id}`;
                const userAns = userAnswers[qKey] || '未作答';
                const correctAns = q.correct;
                const isCorrect = userAns === correctAns;
                const icon = isCorrect ? '✅' : '❌';
                const explanation = examExplain[q.id] || '暂无详解';

                const explainDiv = document.getElementById(`explain-${q.id}`);
                if (explainDiv) {
                    explainDiv.innerHTML = `
                        <div class="ans-line">
                            <span class="ans-icon">${icon}</span>
                            <strong>${q.label}</strong> 你的答案：${userAns} 正确答案：${correctAns}
                        </div>
                        <div class="ans-detail">${explanation}</div>
                    `;
                    explainDiv.style.display = 'block';
                }
            });
        });

        submitted = true;
    }

    function renderPager() {
        prevBtn.disabled = (currentPage <= 1);
        nextBtn.disabled = (currentPage >= exams.length);
        pageInput.value = currentPage;
    }

    function goToPage(page) {
        if (page < 1 || page > exams.length) return;
        currentPage = page;
        currentExamIndex = page - 1;
        initPage();
    }

    prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
    nextBtn.addEventListener('click', () => goToPage(currentPage + 1));
    pageInput.addEventListener('change', (e) => {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) val = 1;
        if (val < 1) val = 1;
        if (val > exams.length) val = exams.length;
        goToPage(val);
    });

    translateBtn.addEventListener('click', () => {
        isTranslated = !isTranslated;
        translateBtn.textContent = isTranslated ? '🌐 隐藏翻译' : '🌐 全文翻译';
        translateBtn.classList.toggle('active', isTranslated);
        // 翻译开启时才显示音色选择
        voiceSelect.style.display = isTranslated ? '' : 'none';
        renderArticle();
    });

    submitBtn.addEventListener('click', submitAnswers);

    // ========== 讲解模式入口 ==========
    function openLecture() {
        const exam = exams[currentExamIndex];
        if (!exam) { alert('题库数据未就绪'); return; }
        if (!window.LectureCore || !window.LectureAdapter) { alert('讲解模式组件未加载'); return; }
        try { if (typeof unlockAudio === 'function') unlockAudio(); } catch (e) {}
        window.LectureCore.open(exam, {});
    }
    window.openLecture = openLecture;

    // iOS 微信音频解锁
    function unlockIOSAudio() {
        try {
            const silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
            silent.volume = 0;
            silent.play().catch(() => {});
        } catch (e) { /* 忽略 */ }
    }

    window.addEventListener('load', () => {
        unlockIOSAudio();
        initPage();
    });
</script>
